<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form login</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
    <section id="login">
        <div class="wrapper-login">
            <div class="container-login">
                <h1>Selamat Datang</h1>
                <p>Silakan login untuk melanjutkan</p>
                <p id="status-login">Status: Belum login</p>
                <button id="btn-logout" type="button">Logout</button>
            </div>
    
            <form id="form-login" novalidate>
                <label for="username">Username</label>
                <input type="text" name="username" id="username" placeholder="Masukan username" required> 
    
                <label for="password">Password</label>
                <div class="password-wrapper">
                    
                    <input type="password" name="password" id="password"  placeholder="Masukan password" required>
                    <span id="toggle-password">👁️</span>
                </div>
                <button type="submit">Login</button>
                <p id="pesan-login"></p>
                <p id="pesan-selamat-datang"></p>
                <button id="btn-toggle-pesan">Tampilkan/Sembunyikan Pesan</button>
        </div>
            </fsorm>
    </section>



    <script src="/js/login.js"></script>
</body>
</html>
