<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Data Mahasiswa</h1>

    <form action="#" method="POST">
        <div class="form-group">
            <label for="nim">NIM: </label>
            <input type="text" name="nim_input" id="nim" placeholder="Masukan NIM"><br><br>
        </div>

        <div class="form-group">
            <label for="nama">Nama: </label>
            <input type="text" name="nama_input" id="nama" placeholder="Masukan Nama"><br><br>
        </div>

        <div class="form-group">
            <label for="tgl">Tgl Lahir (dd-mm-yyyy): </label>
            <input type="date" name="tgl_input" id="tgl"><br><br>
        </div>

        <div class="form-group">
            <label for="kelamin">Jenis Kelamin:</label>
            <input type="radio" name="gendre" id="laki" value="laki">
            <label for="laki">laki-laki</label>
            <input type="radio" name="gendre" id="perempuan" value="perempuan">
            <label for="perempuan">perempuan</label><br><br>
        </div>
        
        <div class="form-group">
            <label for="alamat">Alamat di Bogor:</label>
            <textarea name="alamat" id="alamat" rows="5"></textarea><br><br>
        </div>

        <div class="form-group">
            <label for="tinggal">Tinggal di:</label>
            <select name="tinggal_input" id="tinggal">
                <option value="pilih">--- PILIH SALAH SATU ---</option>
                <option value="kos">Kos/Kontrakan</option>
                <option value="rumah ortu">Rumah Ortu</option>
                <option value="rs">Rumah Saudara</option>
            </select> <br><br>
        </div>

        <div class="form-group">
            <label for="hobi">Pilh 2 hobi yang paling disukai:</label><br>
            <input type="checkbox" name="hobi_input" id="science" value="science">
            <label for="science">science</label><br>
            <input type="checkbox" name="hobi_input" id="tech" value="tech">
            <label for="tech">tech</label><br>
            <input type="checkbox" name="hobi_input" id="art" value="art">
            <label for="art">art</label><br>
            <input type="checkbox" name="hobi_input" id="sport" value="sport">
            <label for="sport">sport</label><br><br>
        <div>

        <div class="form-group">
            <button type="submit" class="btn-submit">Submit</button>
            <button type="reset" class="btn-reset">Reset</button>
        </div>
    </form>
</body>
</html>
